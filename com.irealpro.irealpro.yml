app-id: com.irealpro.irealpro
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: irealpro

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --env=ELECTRON_TRASH=gio  # Required for Electron trash handling

modules:
  - name: irealpro
    buildsystem: simple
    build-commands:
      - install -Dm644 com.irealpro.irealpro.desktop /app/share/applications/com.irealpro.irealpro.desktop
      - install -Dm644 irealpro.png /app/share/icons/hicolor/512x512/apps/com.irealpro.irealpro.png
      - install -Dm644 com.irealpro.irealpro.metainfo.xml /app/share/metainfo/com.irealpro.irealpro.metainfo.xml
      - install -Dm755 apply_extra /app/bin/apply_extra

      - mkdir -p /app/bin
      - |
        cat << 'EOF' > /app/bin/irealpro
        #!/bin/sh
        # Automatically select native Wayland if available, then fall back to X11
        # apply_extra runs inside /app/extra.
        exec /app/extra/iRealPro/irealpro --no-sandbox --ozone-platform-hint=auto "$@"
        EOF
      - chmod +x /app/bin/irealpro

    sources:
      # Non-redistributable proprietary .deb: fetched at install time (not
      # bundled at build time) per Flathub's licensing requirements.
      - type: extra-data
        filename: irealpro.deb
        only-arches: [x86_64]
        url: https://linux.irealpro.com/irealpro_latest_amd64.deb
        sha256: 1eb4b5a17cad0a33957539c9e9caa86872c229f9675ea5a4b7b20001c03bfd1a
        size: 232845200
        x-checker-data:
          type: rotating-url
          url: https://linux.irealpro.com/irealpro_latest_amd64.deb
      - type: extra-data
        filename: irealpro.deb
        only-arches: [aarch64]
        url: https://linux.irealpro.com/irealpro_latest_arm64.deb
        sha256: 083dc1755c28bc0368229f5babaf477bcce50f802045c57c327d7c96417cf1c1
        size: 227910872
        x-checker-data:
          type: rotating-url
          url: https://linux.irealpro.com/irealpro_latest_arm64.deb
      - type: file
        path: com.irealpro.irealpro.desktop
      - type: file
        path: irealpro.png
      - type: file
        path: com.irealpro.irealpro.metainfo.xml
      - type: script
        dest-filename: apply_extra
        commands:
          - bsdtar -xf irealpro.deb data.tar.xz
          - bsdtar -xf data.tar.xz ./opt/iRealPro
          - mv opt/iRealPro iRealPro
          - rm -rf opt irealpro.deb data.tar.xz
